{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Gestión de Inventario EcoLife</h1>
    
    <div class="card p-4 mb-4">
        <h3>Registrar Nuevo Producto</h3>
        <form action="/agregar_producto" method="POST">
            <div class="mb-3">
                <input type="text" name="nombre" class="form-control" placeholder="Nombre del Producto" required>
            </div>
            <div class="mb-3">
                <input type="number" name="cantidad" class="form-control" placeholder="Cantidad en Stock" required>
            </div>
            <div class="mb-3">
                <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio Unitario" required>
            </div>
            <button type="submit" class="btn btn-success">Guardar en Todo el Sistema</button>
        </form>
    </div>

    <h3>Productos en SQLite (SQLAlchemy)</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            {% for prod in productos %}
            <tr>
                <td>{{ prod.id }}</td>
                <td>{{ prod.nombre }}</td>
                <td>{{ prod.cantidad }}</td>
                <td>${{ prod.precio }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
